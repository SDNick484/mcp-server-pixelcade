[build-system]
requires = ["setuptools>=77"]  # 77: SPDX `license` strings (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-pixelcade"
dynamic = ["version"]  # from pixelcade_mcp.__version__ (below)
description = "MCP server for Pixelcade LED marquees and Pixelcade Pulse lighting, via the pixelweb REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas E. Andrade" }]
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server", "pixelcade", "arcade", "batocera", "led-marquee"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.10",   # verifying Cloudflare Access assertions (remote.py)
    "uvicorn>=0.31",         # the HTTP transport (remote.py)
    "typing_extensions>=4.7",
]

[project.urls]
Homepage = "https://github.com/SDNick484/mcp-server-pixelcade"
Issues = "https://github.com/SDNick484/mcp-server-pixelcade/issues"
Changelog = "https://github.com/SDNick484/mcp-server-pixelcade/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
mcp-server-pixelcade = "pixelcade_mcp.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pixelcade_mcp.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src"]
strict = true
